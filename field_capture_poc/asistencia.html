<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>CFA — Control de Asistencia (PoC)</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.16);
      --yellow: #f59e0b;
      --yellow-bg: rgba(245, 158, 11, 0.16);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.16);
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--panel);
      border-bottom: 1px solid #1e293b;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .nav-tabs { display: flex; gap: 6px; }
    .nav-tab {
      text-decoration: none;
      color: var(--muted);
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .nav-tab.active {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
    }
    .hh-badge {
      background: var(--green-bg);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    main {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 680px;
      width: 100%;
      margin: 0 auto 84px;
    }

    .card {
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row.between { justify-content: space-between; }

    input[type="text"], input[type="date"], select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 14px;
      flex: 1;
      min-width: 120px;
    }

    button, .file-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: var(--card);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .file-btn input { display: none; }
    button.primary { background: var(--green); color: #052e16; }
    button.accent { background: var(--accent); color: #082f49; }
    button.ghost { background: #0f172a; border: 1px solid var(--border); color: var(--muted); }
    button.danger { background: var(--red-bg); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    button.sm { padding: 6px 9px; font-size: 12px; border-radius: 8px; }

    .geo-pill {
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .geo-pill.ok { background: var(--green-bg); border-color: rgba(34, 197, 94, 0.5); color: #86efac; }
    .geo-pill.fail { background: var(--red-bg); border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; }
    .geo-pill.warn { background: var(--yellow-bg); border-color: rgba(245, 158, 11, 0.5); color: #fde68a; }

    .worker-list { display: flex; flex-direction: column; gap: 8px; }
    .worker-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .worker-card.presente { border-left: 4px solid var(--green); }
    .worker-card.parcial { border-left: 4px solid var(--yellow); }
    .worker-card.ausente { border-left: 4px solid var(--red); opacity: 0.85; }

    .worker-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .worker-name { font-size: 15px; font-weight: 700; }
    .worker-role { font-size: 12px; color: var(--muted); }
    .worker-hours { font-size: 14px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

    .status-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .status-btn {
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      background: #1e293b;
      color: var(--muted);
      border: 1px solid transparent;
    }
    .status-btn.active-presente { background: var(--green-bg); color: #86efac; border-color: var(--green); }
    .status-btn.active-parcial { background: var(--yellow-bg); color: #fde68a; border-color: var(--yellow); }
    .status-btn.active-ausente { background: var(--red-bg); color: #fca5a5; border-color: var(--red); }

    .sub-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .chip {
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #1e293b;
      color: var(--muted);
      border: 1px solid transparent;
    }
    .chip.selected { background: var(--accent); color: #082f49; }

    .photo-preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: none;
    }
    .photo-meta { font-size: 12px; color: var(--muted); }

    .history-item {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 9px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 8px;
    }

    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(17, 24, 39, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid #1e293b;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      z-index: 25;
    }
    .sticky-footer > div {
      max-width: 680px;
      width: 100%;
      display: flex;
      gap: 8px;
    }

    #toast {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(34, 197, 94, 0.95);
      color: #052e16;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      display: none;
      z-index: 40;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav-tabs">
      <a class="nav-tab" href="./index.html">📷 Cámara</a>
      <a class="nav-tab active" href="./asistencia.html">👷 Asistencia</a>
    </nav>
    <div class="hh-badge" id="totalHhBadge">0.0 HH</div>
  </header>

  <main>
    <!-- Datos de jornada y geofencing 100 m -->
    <section class="card">
      <div class="card-title">
        <span>1. Jornada y Ubicación (Geofence 100 m)</span>
        <button type="button" class="sm accent" id="sameAsYesterdayBtn">Igual que ayer</button>
      </div>
      <div class="row">
        <input type="date" id="dateInput" aria-label="Fecha" />
        <input type="text" id="crewInput" value="Cuadrilla Mampostería A" placeholder="Frente / Cuadrilla" aria-label="Frente o cuadrilla" />
      </div>
      <div class="row between">
        <div class="geo-pill" id="geoStatus">GPS sin validar</div>
        <div class="row">
          <button type="button" class="sm" id="checkGeoBtn">📍 Validar GPS</button>
          <button type="button" class="sm ghost" id="setSiteBtn">Fijar obra aquí</button>
        </div>
      </div>
    </section>

    <!-- Pase de lista 1 toque -->
    <section class="card">
      <div class="card-title">
        <span>2. Pase de Lista (1 toque)</span>
        <span id="presentCountLabel" style="color:#86efac;">0/0 presentes</span>
      </div>
      <div class="worker-list" id="workerList"></div>

      <div class="row" style="margin-top: 4px;">
        <input type="text" id="newWorkerName" placeholder="Nombre del trabajador..." />
        <select id="newWorkerRole" style="flex: 0 0 120px;">
          <option value="Oficial">Oficial</option>
          <option value="Ayudante">Ayudante</option>
          <option value="Maestro">Maestro</option>
        </select>
        <button type="button" class="accent" id="addWorkerBtn">+ Agregar</button>
      </div>
    </section>

    <!-- Evidencia: 1 foto grupal de cuadrilla -->
    <section class="card">
      <div class="card-title">
        <span>3. Foto Grupal de Cuadrilla (Anti-fraude)</span>
        <span class="photo-meta" id="photoMeta">Pendiente</span>
      </div>
      <img id="groupPhotoPreview" class="photo-preview" alt="Foto grupal de cuadrilla" />
      <div class="row">
        <label class="file-btn accent" style="flex: 1;">
          📸 Tomar foto grupal
          <input type="file" id="groupPhotoInput" accept="image/*" capture="environment" />
        </label>
        <button type="button" class="ghost" id="downloadPhotoBtn" style="display:none;">Descargar foto</button>
      </div>
    </section>

    <!-- Historial offline y exportación CSV -->
    <section class="card">
      <div class="card-title">
        <span>Historial Offline (en este teléfono)</span>
        <button type="button" class="sm accent" id="exportCsvBtn">📥 Exportar CSV</button>
      </div>
      <div id="historyList" style="display:flex; flex-direction:column; gap:6px;"></div>
    </section>
  </main>

  <div class="sticky-footer">
    <div>
      <button type="button" class="primary" id="saveDayBtn" style="flex: 1; padding: 12px; font-size: 15px;">
        💾 Guardar asistencia de hoy
      </button>
    </div>
  </div>

  <div id="toast">Guardado</div>
  <canvas id="stampCanvas" style="display:none;"></canvas>

  <script>
    const STORAGE_KEYS = {
      ROSTER: "cfa_poc_roster_v1",
      LOGS: "cfa_poc_attendance_logs_v1",
      SITE: "cfa_poc_site_coords_v1",
    };

    const DEFAULT_ROSTER = [
      { id: "w1", name: "Carlos Méndez", role: "Oficial", status: "presente", normalHours: 8, extraHours: 0, reason: "" },
      { id: "w2", name: "José López", role: "Oficial", status: "presente", normalHours: 8, extraHours: 0, reason: "" },
      { id: "w3", name: "Luis Morales", role: "Ayudante", status: "presente", normalHours: 8, extraHours: 0, reason: "" },
      { id: "w4", name: "Pedro Castillo", role: "Ayudante", status: "presente", normalHours: 8, extraHours: 0, reason: "" },
    ];

    const dateInput = document.getElementById("dateInput");
    const crewInput = document.getElementById("crewInput");
    const geoStatus = document.getElementById("geoStatus");
    const workerList = document.getElementById("workerList");
    const totalHhBadge = document.getElementById("totalHhBadge");
    const presentCountLabel = document.getElementById("presentCountLabel");
    const groupPhotoInput = document.getElementById("groupPhotoInput");
    const groupPhotoPreview = document.getElementById("groupPhotoPreview");
    const photoMeta = document.getElementById("photoMeta");
    const downloadPhotoBtn = document.getElementById("downloadPhotoBtn");
    const historyList = document.getElementById("historyList");
    const toast = document.getElementById("toast");
    const stampCanvas = document.getElementById("stampCanvas");

    let workers = loadRoster();
    let geoState = { checked: false, inside: null, distanceM: null, lat: null, lng: null };
    let groupPhotoDataUrl = null;
    let groupPhotoTimestamp = null;

    dateInput.value = new Date().toISOString().slice(0, 10);

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2200);
    }

    function loadRoster() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.ROSTER));
        if (Array.isArray(saved) && saved.length > 0) return saved;
      } catch (_) {}
      return structuredClone(DEFAULT_ROSTER);
    }

    function saveRoster() {
      localStorage.setItem(STORAGE_KEYS.ROSTER, JSON.stringify(workers));
    }

    function loadLogs() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOGS));
        return Array.isArray(saved) ? saved : [];
      } catch (_) {
        return [];
      }
    }

    function saveLogs(logs) {
      localStorage.setItem(STORAGE_KEYS.LOGS, JSON.stringify(logs));
    }

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function updateGeoBadge() {
      const site = JSON.parse(localStorage.getItem(STORAGE_KEYS.SITE) || "null");
      if (!geoState.checked) {
        geoStatus.className = "geo-pill";
        geoStatus.textContent = site ? "GPS pendiente (obra fijada)" : "Sin punto de obra fijado";
        return;
      }
      if (!site) {
        geoStatus.className = "geo-pill warn";
        geoStatus.textContent = `GPS OK (${geoState.lat.toFixed(4)}, ${geoState.lng.toFixed(4)}) — Fija la obra`;
        return;
      }
      const dist = Math.round(geoState.distanceM);
      if (geoState.inside) {
        geoStatus.className = "geo-pill ok";
        geoStatus.textContent = `✅ En obra (${dist} m ≤ 100 m)`;
      } else {
        geoStatus.className = "geo-pill fail";
        geoStatus.textContent = `⚠️ Fuera de obra (${dist} m > 100 m)`;
      }
    }

    function requestGps(setAsSite = false) {
      if (!navigator.geolocation) {
        alert("Este navegador no soporta geolocalización.");
        return;
      }
      geoStatus.textContent = "Obteniendo GPS...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          if (setAsSite) {
            localStorage.setItem(STORAGE_KEYS.SITE, JSON.stringify({ lat: latitude, lng: longitude }));
            showToast("Punto de obra fijado (radio 100 m)");
          }
          const site = JSON.parse(localStorage.getItem(STORAGE_KEYS.SITE) || "null");
          const distanceM = site ? haversineMeters(latitude, longitude, site.lat, site.lng) : 0;
          geoState = {
            checked: true,
            lat: latitude,
            lng: longitude,
            distanceM,
            inside: site ? distanceM <= 100 : null,
          };
          updateGeoBadge();
        },
        () => {
          geoStatus.className = "geo-pill fail";
          geoStatus.textContent = "No se pudo leer el GPS";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function workerTotalHours(w) {
      if (w.status === "ausente") return 0;
      return Number(w.normalHours || 0) + Number(w.extraHours || 0);
    }

    function renderWorkers() {
      workerList.innerHTML = "";
      let totalHH = 0;
      let presentCount = 0;

      workers.forEach((w, idx) => {
        const hh = workerTotalHours(w);
        totalHH += hh;
        if (w.status !== "ausente") presentCount++;

        const card = document.createElement("div");
        card.className = `worker-card ${w.status}`;

        let subHtml = "";
        if (w.status === "presente") {
          subHtml = `
            <div class="sub-controls">
              <span style="font-size:11px; color:var(--muted);">Extra:</span>
              ${[0, 1, 2, 3].map((ex) => `
                <button type="button" class="chip ${w.extraHours === ex ? "selected" : ""}" data-action="extra" data-idx="${idx}" data-val="${ex}">
                  ${ex === 0 ? "Sin extra" : `+${ex}h`}
                </button>
              `).join("")}
            </div>
          `;
        } else if (w.status === "parcial") {
          subHtml = `
            <div class="sub-controls">
              <span style="font-size:11px; color:var(--muted);">Horas:</span>
              ${[2, 4, 6].map((hrs) => `
                <button type="button" class="chip ${w.normalHours === hrs ? "selected" : ""}" data-action="partialHours" data-idx="${idx}" data-val="${hrs}">
                  ${hrs} h
                </button>
              `).join("")}
            </div>
          `;
        } else {
          subHtml = `
            <div class="sub-controls">
              <span style="font-size:11px; color:var(--muted);">Motivo:</span>
              ${["Falta", "Permiso", "Incapacidad"].map((r) => `
                <button type="button" class="chip ${w.reason === r ? "selected" : ""}" data-action="reason" data-idx="${idx}" data-val="${r}">
                  ${r}
                </button>
              `).join("")}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="worker-top">
            <div>
              <div class="worker-name">${w.name}</div>
              <div class="worker-role">${w.role}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <div class="worker-hours">${hh.toFixed(1)} HH</div>
              <button type="button" class="sm danger" data-action="remove" data-idx="${idx}" title="Quitar">✕</button>
            </div>
          </div>
          <div class="status-group">
            <button type="button" class="status-btn ${w.status === "presente" ? "active-presente" : ""}" data-action="status" data-idx="${idx}" data-val="presente">✅ Presente</button>
            <button type="button" class="status-btn ${w.status === "parcial" ? "active-parcial" : ""}" data-action="status" data-idx="${idx}" data-val="parcial">⏰ Parcial</button>
            <button type="button" class="status-btn ${w.status === "ausente" ? "active-ausente" : ""}" data-action="status" data-idx="${idx}" data-val="ausente">❌ Ausente</button>
          </div>
          ${subHtml}
        `;
        workerList.appendChild(card);
      });

      totalHhBadge.textContent = `${totalHH.toFixed(1)} HH`;
      presentCountLabel.textContent = `${presentCount}/${workers.length} presentes`;
      saveRoster();
    }

    workerList.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const idx = Number(btn.dataset.idx);
      const action = btn.dataset.action;
      const val = btn.dataset.val;
      const w = workers[idx];
      if (!w) return;

      if (action === "status") {
        w.status = val;
        if (val === "presente") {
          w.normalHours = 8;
          w.reason = "";
        } else if (val === "parcial") {
          w.normalHours = 4;
          w.extraHours = 0;
          w.reason = "";
        } else if (val === "ausente") {
          w.normalHours = 0;
          w.extraHours = 0;
          w.reason = w.reason || "Falta";
        }
      } else if (action === "extra") {
        w.extraHours = Number(val);
      } else if (action === "partialHours") {
        w.normalHours = Number(val);
      } else if (action === "reason") {
        w.reason = val;
      } else if (action === "remove") {
        workers.splice(idx, 1);
      }
      renderWorkers();
    });

    document.getElementById("addWorkerBtn").addEventListener("click", () => {
      const nameInput = document.getElementById("newWorkerName");
      const roleSelect = document.getElementById("newWorkerRole");
      const name = nameInput.value.trim();
      if (!name) return;
      workers.push({
        id: `w_${Date.now()}`,
        name,
        role: roleSelect.value,
        status: "presente",
        normalHours: 8,
        extraHours: 0,
        reason: "",
      });
      nameInput.value = "";
      renderWorkers();
      showToast(`${name} agregado`);
    });

    document.getElementById("sameAsYesterdayBtn").addEventListener("click", () => {
      const logs = loadLogs();
      if (logs.length === 0) {
        workers.forEach((w) => { w.status = "presente"; w.normalHours = 8; w.extraHours = 0; w.reason = ""; });
        renderWorkers();
        showToast("Todos marcados presentes (8h)");
        return;
      }
      const last = logs[0];
      workers = structuredClone(last.workers);
      crewInput.value = last.crew;
      renderWorkers();
      showToast(`Copiado de ${last.date}`);
    });

    groupPhotoInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        // Comprimir y estampar fecha/hora/GPS/presentes sobre la foto grupal
        const maxW = 1200;
        const scale = Math.min(1, maxW / img.naturalWidth);
        stampCanvas.width = Math.round(img.naturalWidth * scale);
        stampCanvas.height = Math.round(img.naturalHeight * scale);
        const ctx = stampCanvas.getContext("2d");
        ctx.drawImage(img, 0, 0, stampCanvas.width, stampCanvas.height);

        const nowStr = new Date().toLocaleString("es-ES");
        const present = workers.filter((w) => w.status !== "ausente").length;
        const geoTxt = geoState.checked
          ? (geoState.inside === false ? `FUERA (${Math.round(geoState.distanceM)}m)` : `EN OBRA (${Math.round(geoState.distanceM || 0)}m)`)
          : "GPS N/A";

        ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
        ctx.fillRect(0, stampCanvas.height - 54, stampCanvas.width, 54);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(`CFA ASISTENCIA | ${crewInput.value} | ${present}/${workers.length} presentes`, 14, stampCanvas.height - 29);
        ctx.fillStyle = "#86efac";
        ctx.font = "16px sans-serif";
        ctx.fillText(`${nowStr} | ${geoTxt}`, 14, stampCanvas.height - 9);

        groupPhotoDataUrl = stampCanvas.toDataURL("image/jpeg", 0.78);
        groupPhotoTimestamp = nowStr;
        groupPhotoPreview.src = groupPhotoDataUrl;
        groupPhotoPreview.style.display = "block";
        photoMeta.textContent = `Capturada ${nowStr}`;
        downloadPhotoBtn.style.display = "inline-flex";
        showToast("Foto grupal estampada");
      };
      img.src = URL.createObjectURL(file);
    });

    downloadPhotoBtn.addEventListener("click", () => {
      if (!groupPhotoDataUrl) return;
      const a = document.createElement("a");
      a.href = groupPhotoDataUrl;
      const safeCrew = (crewInput.value || "cuadrilla").replace(/[^a-zA-Z0-9_-]/g, "_");
      a.download = `asistencia_${dateInput.value}_${safeCrew}.jpg`;
      a.click();
    });

    function renderHistory() {
      const logs = loadLogs();
      if (logs.length === 0) {
        historyList.innerHTML = `<div style="font-size:12px; color:var(--muted);">Aún no hay jornadas guardadas en este teléfono.</div>`;
        return;
      }
      historyList.innerHTML = logs.slice(0, 14).map((log) => {
        const present = log.workers.filter((w) => w.status !== "ausente").length;
        const hh = log.workers.reduce((acc, w) => acc + workerTotalHours(w), 0);
        const geoBadge = log.geo?.inside === true ? "✅ GPS" : (log.geo?.inside === false ? "⚠️ Fuera" : "—");
        const photoBadge = log.hasGroupPhoto ? "📸" : "";
        return `
          <div class="history-item">
            <div>
              <strong>${log.date}</strong> · ${log.crew}<br/>
              <span style="color:var(--muted);">${present}/${log.workers.length} presentes · ${geoBadge} ${photoBadge}</span>
            </div>
            <div style="font-weight:800; color:var(--accent);">${hh.toFixed(1)} HH</div>
          </div>
        `;
      }).join("");
    }

    document.getElementById("saveDayBtn").addEventListener("click", () => {
      const logs = loadLogs();
      const record = {
        id: `${dateInput.value}_${crewInput.value}`,
        date: dateInput.value,
        crew: crewInput.value.trim() || "Cuadrilla",
        savedAt: new Date().toISOString(),
        geo: geoState,
        hasGroupPhoto: Boolean(groupPhotoDataUrl),
        photoTimestamp: groupPhotoTimestamp,
        workers: structuredClone(workers),
      };
      const existingIdx = logs.findIndex((l) => l.id === record.id);
      if (existingIdx >= 0) logs[existingIdx] = record;
      else logs.unshift(record);

      saveLogs(logs);
      renderHistory();
      showToast(`Asistencia guardada (${record.date})`);
    });

    document.getElementById("exportCsvBtn").addEventListener("click", () => {
      const logs = loadLogs();
      if (logs.length === 0) {
        alert("Primero guarda al menos una jornada de asistencia.");
        return;
      }
      const headers = [
        "fecha",
        "frente",
        "trabajador",
        "rol",
        "estado",
        "horas_normales",
        "horas_extra",
        "total_hh",
        "motivo_ausencia",
        "en_obra_100m",
        "distancia_m",
        "hora_registro",
        "tiene_foto_grupal",
      ];
      const rows = [headers.join(",")];
      const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;

      logs.forEach((log) => {
        log.workers.forEach((w) => {
          const hh = workerTotalHours(w);
          const inSite = log.geo?.inside === true ? "SI" : (log.geo?.inside === false ? "NO" : "N/A");
          const dist = log.geo?.distanceM != null ? Math.round(log.geo.distanceM) : "";
          rows.push([
            esc(log.date),
            esc(log.crew),
            esc(w.name),
            esc(w.role),
            esc(w.status),
            w.normalHours || 0,
            w.extraHours || 0,
            hh,
            esc(w.reason || ""),
            esc(inSite),
            dist,
            esc(log.savedAt),
            log.hasGroupPhoto ? "SI" : "NO",
          ].join(","));
        });
      });

      const blob = new Blob(["\uFEFF" + rows.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cfa_asistencia_planilla_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("CSV exportado para planilla");
    });

    document.getElementById("checkGeoBtn").addEventListener("click", () => requestGps(false));
    document.getElementById("setSiteBtn").addEventListener("click", () => requestGps(true));

    updateGeoBadge();
    renderWorkers();
    renderHistory();
  </script>
</body>
</html>
